name: release

# Cuts a GitHub release whenever a `v*` tag is pushed. Notes are built from
# `git log` between the previous tag and the new one, so the changelog is just
# the commit summaries on the branch — keep commit messages clean.
#
# Tags containing a hyphen (e.g. v1.2.0-rc1, v2.0.0-beta.3) are marked as
# pre-releases automatically.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe` can find the prior tag

      - name: Build release notes from commit log
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="${prev}..${TAG}"
            header="## Changes since ${prev}"
          else
            range="${TAG}"
            header="## Initial release"
          fi
          {
            echo "$header"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$range"
            echo
          } > NOTES.md
          echo "--- NOTES.md ---"
          cat NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file NOTES.md \
            $prerelease
