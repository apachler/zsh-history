name: typos

# Catches typos in code, docs, and comments. crate-ci/typos is fast,
# config-driven, and (unlike shellcheck) understands the project doesn't
# need to be Bash. False positives can be silenced in _typos.toml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: typos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crate-ci/typos@v1.27.0
