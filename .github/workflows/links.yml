name: links

# Verify URLs in Markdown files still resolve. Runs on PRs that touch
# Markdown plus a weekly cron so rot in external links surfaces even when
# nothing in the repo changes.

on:
  pull_request:
    paths:
      - '**.md'
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lychee
        # Pinned to a specific release rather than `latest` so a bad lychee
        # release can't break this workflow without an explicit version bump.
        env:
          LYCHEE_VERSION: v0.18.1
        run: |
          curl -sSL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin lychee
          lychee --version

      - name: Check links
        # Behaviour is controlled by lychee.toml in the repo root. Keep the
        # command thin so local runs match CI.
        run: lychee --config lychee.toml --exclude-mail -- '**/*.md'
