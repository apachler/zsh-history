name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install zsh + fzf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fzf

      - name: Install fzf (macOS — zsh is preinstalled)
        if: runner.os == 'macOS'
        run: brew install fzf

      - name: Record toolchain
        run: |
          zsh --version
          awk --version 2>/dev/null | head -n1 || awk 'BEGIN{print "BSD awk"}'

      - name: Syntax check
        run: zsh -n zsh-history.plugin.zsh

      - name: Source in a clean shell
        run: |
          zsh -c '
            source ./zsh-history.plugin.zsh
            type zsh_history >/dev/null
            type history    >/dev/null
            [[ $HISTSIZE -ge 50000 ]]
            [[ $SAVEHIST -ge 10000 ]]
          '

      - name: HIST_STAMPS variants do not break alias
        run: |
          for fmt in "mm/dd/yyyy" "dd.mm.yyyy" "yyyy-mm-dd" "custom fmt" "weird'quote"; do
            HIST_STAMPS="$fmt" zsh -c 'source ./zsh-history.plugin.zsh; alias history >/dev/null'
          done

      - name: HISTSIZE / SAVEHIST defaults survive unset env
        run: |
          env -u HISTSIZE -u SAVEHIST -u HISTFILE zsh -c '
            source ./zsh-history.plugin.zsh
            [[ $HISTSIZE -eq 50000 && $SAVEHIST -eq 10000 ]]
          '

      - name: ZSH_HISTORY_IGNORE filter accepts and rejects
        run: |
          zsh -c '
            source ./zsh-history.plugin.zsh
            ZSH_HISTORY_IGNORE="(*--token=*|*PASSWORD=*)"
            _zsh_history_filter "git status"            # should return 0
            ! _zsh_history_filter "curl --token=ABC"    # should return 1
            ! _zsh_history_filter "export PASSWORD=hi"  # should return 1
          '

      - name: --top ranks commands from a fixture HISTFILE
        run: |
          tmp=$(mktemp)
          cat > "$tmp" <<EOF
          : 1:0;git status
          : 2:0;git push
          : 3:0;ls
          : 4:0;git status
          : 5:0;ls
          EOF
          out=$(HISTFILE="$tmp" zsh -c '
            setopt extended_history
            fc -R $HISTFILE
            source ./zsh-history.plugin.zsh
            zsh_history --top 5
          ')
          echo "$out"
          # Trim whitespace before comparing — macOS `uniq -c` and GNU `uniq -c`
          # use different leading padding widths.
          first=$(echo "$out" | sed -n '1p' | awk '{print $1, $2}')
          second=$(echo "$out" | sed -n '2p' | awk '{print $1, $2}')
          [ "$first"  = "3 git" ]
          [ "$second" = "2 ls"  ]

      - name: history -d rewrites HISTFILE without a target entry
        run: |
          tmp=$(mktemp)
          cat > "$tmp" <<EOF
          : 1:0;echo hello
          : 2:0;git status
          : 3:0;curl --token=SECRET
          : 4:0;ls -la
          EOF
          zsh -c '
            HISTFILE='"$tmp"'
            setopt extended_history
            fc -R $HISTFILE
            source ./zsh-history.plugin.zsh
            zsh_history -d 3
          '
          # The sensitive command must be gone; the others must remain.
          ! grep -q 'curl --token=SECRET' "$tmp"
          grep -q 'echo hello'  "$tmp"
          grep -q 'git status'  "$tmp"
          grep -q 'ls -la'      "$tmp"
