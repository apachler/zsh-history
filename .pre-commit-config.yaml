# Opt-in local checks. Install with `pip install pre-commit && pre-commit install`.
# CI doesn't depend on this — it's a contributor-side convenience.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: zsh-syntax-check
        name: zsh -n on plugin
        entry: zsh -n
        language: system
        files: \.(zsh|plugin\.zsh)$
        pass_filenames: true
