# Config for the link-check workflow. Edit here rather than passing flags
# in the workflow so behavior stays consistent if you also run lychee locally.

# Hosts that throttle or 403 unauthenticated automation but are otherwise
# fine for end users. Add sparingly.
exclude = [
  '^https?://(www\.)?contributor-covenant\.org',
]

# Treat these as success even though they're not 2xx. 401/403 means the URL
# exists but requires auth (common for shields.io, etc); 429 means rate-limited.
accept = ["200..=299", "401", "403", "429"]

max_redirects = 5
no_progress = true
verbose = "info"
